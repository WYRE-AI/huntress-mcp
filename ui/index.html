<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huntress Incident Card</title>
    <style>
      :root {
        --brand-primary: #f6511d;
        --brand-accent: #ffe8d9;
        --brand-bg: #ffffff;
        --brand-text: #1f2937;
        --brand-muted: #6b7280;
        --brand-line: #e5e7eb;
        --brand-font-heading: system-ui, -apple-system, "Segoe UI", sans-serif;
        --brand-font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
        --brand-radius: 6px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--brand-bg);
        color: var(--brand-text);
        font-family: var(--brand-font-body);
        font-size: 15px;
        line-height: 1.5;
        padding: 16px;
      }
      .card {
        max-width: 560px;
        border: 1px solid var(--brand-line);
        border-radius: var(--brand-radius);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .card__bar { height: 4px; background: var(--brand-primary); }
      .card__body { padding: 20px 24px 24px; }
      .idrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .incidentid {
        font-family: var(--brand-font-heading);
        color: var(--brand-muted);
        font-size: 14px;
        letter-spacing: 0.04em;
      }
      h1 {
        font-family: var(--brand-font-heading);
        color: var(--brand-primary);
        font-weight: 600;
        font-size: 21px;
        line-height: 1.15;
        margin: 0 0 16px;
      }
      .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .badge {
        font-family: var(--brand-font-heading);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 4px 10px;
        border-radius: var(--brand-radius);
        border: 1px solid var(--brand-line);
        color: var(--brand-text);
      }
      .badge--status { border-color: var(--brand-primary); color: var(--brand-primary); }
      .badge--sev { background: var(--brand-accent); border-color: var(--brand-accent); }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 24px;
        margin-bottom: 18px;
      }
      .field__label {
        font-family: var(--brand-font-heading);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
        color: var(--brand-muted);
        margin-bottom: 2px;
      }
      .field__value { font-size: 14px; font-weight: 600; }
      .summary { border-top: 1px solid var(--brand-line); padding-top: 14px; }
      .summary__h {
        font-family: var(--brand-font-heading);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 11px;
        color: var(--brand-muted);
        margin-bottom: 8px;
      }
      .summary__body {
        font-size: 14px;
        padding: 8px 10px;
        background: #fafafa;
        border-left: 2px solid var(--brand-primary);
      }
      .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
      .btn {
        background: var(--brand-accent);
        color: var(--brand-text);
        border: 0;
        border-radius: var(--brand-radius);
        padding: 8px 16px;
        font-family: var(--brand-font-heading);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .loading { color: var(--brand-muted); font-style: italic; }
    </style>
  </head>
  <body>
    <div id="root"><p class="loading">Loading incident…</p></div>
    <script type="module" src="./incident-card.ts"></script>
  </body>
</html>
